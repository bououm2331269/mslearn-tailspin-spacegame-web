trigger:
- '*'

pool:
  vmImage: 'ubuntu-latest'
  demands:
  - npm

variables:
  buildConfiguration: 'Release'
  wwwrootDir: 'Tailspin.SpaceGame.Web/wwwroot'
  dotnetSdkVersion: '8.0.x'

steps:
# .NET SDK
- task: UseDotNet@2
  displayName: 'Use .NET SDK $(dotnetSdkVersion)'
  inputs:
    version: '$(dotnetSdkVersion)'

# (Optionnel si tu accèdes à un feed privé Azure Artifacts)
- task: NuGetAuthenticate@1
  displayName: 'Authenticate to Azure Artifacts'

# Node + npm
- task: NodeTool@0
  displayName: 'Use Node 18.x'
  inputs:
    versionSpec: '18.x'

- task: Npm@1
  displayName: 'Run npm install'
  inputs:
    command: 'install'
    workingDir: 'Tailspin.SpaceGame.Web'
    verbose: false

# Sass (dart-sass via npx)
- script: 'npx sass wwwroot:wwwroot'
  displayName: 'Compile Sass assets'
  workingDirectory: 'Tailspin.SpaceGame.Web'

# Restore des dépendances .NET via dotnet (et plus via nuget.exe)
- task: DotNetCoreCLI@2
  displayName: 'Restore project dependencies'
  inputs:
    command: 'restore'
    projects: 'Tailspin.SpaceGame.Web.sln'
    feedsToUse: 'select'
    vstsFeed: '$(System.TeamProject)/Tailspin.SpaceGame.Web.Models'
    includeNuGetOrg: true


- task: DotNetCoreCLI@2
  displayName: 'Build the project - $(buildConfiguration)'
  inputs:
    command: 'build'
    arguments: '--configuration $(buildConfiguration)'
    projects: 'Tailspin.SpaceGame.Web.sln'

- task: DotNetCoreCLI@2
  displayName: 'Publish the project - $(buildConfiguration)'
  inputs:
    command: 'publish'
    projects: 'Tailspin.SpaceGame.Web.sln'
    publishWebProjects: false
    arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/$(buildConfiguration)'
    zipAfterPublish: true

- task: PublishBuildArtifacts@1
  displayName: 'Publish Artifact: drop'
  condition: succeeded()
